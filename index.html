<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyunsun Roh</title>
    <style>
      :root {
        --bg: #eef8ff;
        --ink: #3d4b5e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, #fdfefe 0%, transparent 24%),
          linear-gradient(135deg, #f2fbff 0%, var(--bg) 100%);
        color: var(--ink);
        font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
        overflow: hidden;
      }

      .card {
        text-align: center;
        padding: 2rem 1.5rem 2.5rem;
        width: min(92vw, 390px);
        position: relative;
      }

      .name {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 1.8rem;
        letter-spacing: 0.02em;
        color: #2d4059;
      }

      .info {
        font-size: 0.82rem;
        line-height: 1.75;
        margin: 0;
        opacity: 0.95;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
        margin: 0 auto 0.7rem;
        color: #133557;
        text-decoration: none;
        animation: blink 2s ease-in-out infinite;
      }

      .badge:hover {
        transform: translateY(-1px);
      }

      .badge svg {
        width: 26px;
        height: 26px;
        display: block;
        fill: currentColor;
      }

      .mail {
        margin-top: 0.12rem;
      }

      .github a {
        color: inherit;
        text-decoration: underline;
      }

      .ellipsis {
        display: inline-block;
        margin-top: 2rem;
        color: inherit;
        text-decoration: none;
        letter-spacing: 0.1em;
      }

      @keyframes blink {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.55;
          transform: scale(0.92);
        }
      }

      @media (max-width: 600px) {
        .card {
          padding-top: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <a class="badge" href="https://velog.io/@hyunsun/posts" target="_blank" rel="noreferrer noopener" aria-label="Hyunsun 블로그로 이동">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
          <path d="M24 8L24 6 22 6 22 4 20 4 20 6 18 6 18 8 17 8 16 8 16 10 14 10 14 8 13 8 12 8 12 6 10 6 10 4 8 4 8 6 6 6 6 8 4 8 4 10 4 18 6 18 6 20 8 20 8 22 10 22 10 24 12 24 12 26 15 26 18 26 18 24 20 24 20 22 22 22 22 20 24 20 24 18 26 18 26 10 26 8z" />
        </svg>
      </a>
      <h1 class="name">Hyunsun Roh</h1>
      <p class="info">cs student @ ewu</p>
      <p class="info">interested in data science, deep learning</p>
      <p class="info mail">email: roh.hyunsun@gmail.com</p>
      <p class="info github">github: <a href="https://github.com/goblurry" target="_blank" rel="noreferrer noopener">https://github.com/goblurry</a></p>
      <span class="ellipsis">•••</span>
    </main>
  </body>
</html>
